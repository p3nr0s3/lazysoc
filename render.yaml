services:
  - type: web
    name: lazysoc
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      # Login for the whole app (set both in the Render dashboard; the service is public otherwise)
      - key: LAZYSOC_AUTH_USER
        sync: false
      - key: LAZYSOC_AUTH_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: ABUSEIPDB_API_KEY
        sync: false
